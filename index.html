    <!-- أنماط إضافية -->
    <style>
      body {
        font-family: 'Cairo', sans-serif;
        transition: background-color 0.4s ease, color 0.4s ease;
      }
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden; /* يمنع تمرير الخلفية */
}

#chat-box {
  flex: 1;
  overflow-y: auto; /* فقط صندوق الدردشة قابل للتمرير */
  -webkit-overflow-scrolling: touch; /* تمرير سلس على iOS */
}



      .dark { background-color: #111; color: #fff; }

      .fade-in { animation: fadeIn 0.4s ease-in-out; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background-color: #b91c1c; border-radius: 3px; }

      #loader {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background-color: #7f1d1d; color: #fff; font-size: 1.5rem; font-weight: bold; z-index: 9999;
        transition: opacity 0.5s ease;
      }
      #loader.hidden { opacity: 0; pointer-events: none; }

      body.dark {
  background-color: #111 !important;
  color: #fff !important;
}

/* تغيير خلفية صندوق الدردشة عند الوضع الليلي */
body.dark #chat-box {
  background-color: #333 !important;
  color: #fff !important;
}

/* تغيير خلفية الهيدر */
body.dark header {
  background-color: #222 !important;
}
body.dark  {
  background-color: #111 !important;
  color: #fff !important;
}

body.dark #chat-box {
  background-color: #333 !important;
  color: #fff !important;
}

body.dark header {
  background-color: #222 !important;
}

body.dark form {
  background-color: #333 !important;
  color: #fff;
}

/* الوضع الليلي للأزرار الإضافية */
body.dark .dark-buttons {
  background-color: #222 !important;
  border-color: #555 !important;
}

body.dark .dark-buttons button {
  background-color: #555 !important;
  color: #fff !important;
}

body.dark .dark-buttons button:hover {
  background-color: #777 !important;
}
body {
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* ألوان خلفية مخصصة للوضعين */
.bg-main-light { background-color: rgba(153, 27, 27, 0.9); } /* أحمر شفاف */
.bg-main-dark { background-color: #1e1e1e; } /* رمادي غامق */

/* صندوق الدردشة */
.bg-chat-light { background-color: rgba(255, 255, 85, 0.7); }
.bg-chat-dark { background-color: #2a2a2a; }

/* نموذج الإدخال */
.bg-input-light { background-color: rgba(255, 255, 85, 0.9); }
.bg-input-dark { background-color: #333; }

/* الهيدر */
.bg-header-light { background-color: #b91c1c; }
.bg-header-dark { background-color: #222; }


    </style>
  </head>
<body class="bg-[#7f1d1d] text-white min-h-screen flex items-center justify-center p-0">

    <!-- شاشة التحميل -->
    <div id="loader">جارٍ التحميل...</div>



<!-- وضع زر الهامبرغر داخل نفس اللوحة تقريبًا على يسار المحتوى -->
<div class="relative w-full max-w-3xl flex flex-col h-screen">

  <!-- زر الهامبرغر -->
  <div class="absolute top-6 right-3 z-50   ">
    <button id="menu-toggle" class="flex flex-col justify-between w-8 h-6 focus:outline-none">
      <span class="block h-1 w-full bg-yellow-400 rounded"></span>
      <span class="block h-1 w-full bg-yellow-400 rounded"></span>
      <span class="block h-1 w-full bg-yellow-400 rounded"></span>
    </button>

    <!-- القائمة المنسدلة -->
    <div id="menu" class="hidden mt-2 flex flex-col bg-[#b91c1c]/95 rounded-xl shadow-lg p-3 space-y-2 min-w-[150px]">
      <a href="https://www.facebook.com/profile.php?id=61575755113422" target="_blank" class="flex items-center gap-2 text-[#facc15] hover:text-white hover:bg-[#7f1d1d] rounded-lg p-2 transition">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook" class="w-5 h-5"> فيسبوك
      </a>
      <a href="https://maps.app.goo.gl/Vcb6FhPRmufoSNva7" target="_blank" class="flex items-center gap-2 text-[#facc15] hover:text-white hover:bg-[#7f1d1d] rounded-lg p-2 transition">
  <!-- أيقونة خريطة Google Maps أنيقة -->
  <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png" alt="Map" class="w-5 h-5">
  الموقع
</a>

      <a href="https://wa.me/+218930423955" target="_blank" class="flex items-center gap-2 text-[#facc15] hover:text-white hover:bg-[#7f1d1d] rounded-lg p-2 transition">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WhatsApp" class="w-5 h-5"> واتساب
      </a>
    </div>
  </div>

  <div class="w-full h-screen bg-main-light dark:bg-main-dark shadow-inner overflow-hidden flex flex-col border-t border-[#facc15]/30 transition-colors duration-500">


      <!-- Header -->
     <header class="bg-header-light dark:bg-header-dark p-6 text-center border-b border-[#facc15]/40 shadow-md flex flex-col items-center justify-center gap-3 transition-colors duration-500">

        <div class="w-20 h-20 bg-[#facc15] rounded-full flex items-center justify-center text-[#7f1d1d] font-bold text-xl shadow-md overflow-hidden">
          <img src="photo_2025-11-03_17-48-24.jpg" alt="Logo" class="w-full h-full object-cover" />
        </div>
        <div class="mt-2"><h2 class="font-['Playfair_Display'] text-2xl tracking-wide text-[#facc15]">The Castle</h2></div>
        <p class="text-[#fde68a] mt-2 text-sm">مرحبًا بك، كيف يمكنني مساعدتك اليوم؟</p>
      </header>

      <!-- Chat Box -->
       <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-4 bg-chat-light dark:bg-chat-dark scroll-smooth transition-colors duration-500"></div>

      <!-- Input Form -->
       <form id="chat-form" class="flex flex-wrap items-center justify-between gap-2 p-3 bg-input-light dark:bg-input-dark border-t border-[#facc54]/30 transition-colors duration-500">

        <button type="button" id="voice-btn" class="bg-[#facc15] hover:bg-[#eab308] transition p-2 rounded-lg text-[#7f1d1d] text-lg font-bold flex-shrink-0 w-10 h-10 sm:w-auto sm:h-auto" title="استخدم الصوت">🎤</button>
        <input type="text" id="user-input" placeholder="اكتب رسالتك ..." class="flex-1 min-w-[100px] p-2 rounded-lg bg-white text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#facc15]" required />
        <button type="submit" class="bg-[#dc2626] hover:bg-[#dc2626] transition px-3 py-2 rounded-lg font-semibold text-white flex-shrink-0 w-16">إرسال</button>
        <button type="button" onclick="clearChat()" class="bg-[#dc2626] hover:bg-[#b91c1c] transition px-3 py-2 rounded-lg text-white font-semibold flex-shrink-0 w-14">🗑️</button>
      </form>

      <!-- أزرار إضافية -->
      <div class="flex justify-between items-center p-3 bg-[#b91c1c]/90 border-t border-[#facc15]/40 dark-buttons">
        <button id="mode-toggle" class="bg-[#facc15] text-[#7f1d1d] px-3 py-2 rounded-lg font-semibold hover:bg-[#eab308] transition ">🌓 تبديل الوضع</button>
        <button id="download-btn" class="bg-[#facc15] text-[#7f1d1d] px-3 py-2 rounded-lg font-semibold hover:bg-[#eab308] transition">💾 تحميل المحادثة</button>
      </div>
    </div>

    <!-- ربط الجافا سكربت -->
    <script src="script.js"></script>
  </body>
</html>
